<!doctype html>
<html lang="en" data-skin="werewolf">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CSP: allow local files and inline styles; no remote scripts -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' file:;" />
    <title>Skinwalker</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Frameless window drag region — the skin JS overrides this per-skin -->
    <div id="titlebar" aria-hidden="true"></div>
    <!-- Monster player mounts here -->
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
